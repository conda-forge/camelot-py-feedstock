{% set name = "camelot-py" %}
{% set version = "2.1.0" %}
package:
  name: {{ name|lower }}
  version: {{ version }}
source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/camelot_py-{{ version }}.tar.gz
  sha256: e56dfa8f447107a29d54b31493195fa735083b607045cab99f7859596699a90b
build:
  noarch: python
  entry_points:
    - camelot = camelot.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - __unix
    - click >=8.0.1
    - pillow >=10.4.0
    - numpy >=1.26.1
    - openpyxl >=3.1.0
    - pandas >=2.2.2
    - tabulate >=0.9.0
    - opencv >=4.7.0.68
    - pypdfium2 >=4
    - playa-pdf >=0.8.1
test:
  imports:
    - camelot
  commands:
    - pip check
    - camelot --help
  requires:
    - python {{ python_min }}
    - pip
about:
  home: http://camelot-py.readthedocs.io/
  license: MIT
  license_file: LICENSE
  summary: PDF Table Extraction for Humans.

extra:
  recipe-maintainers:
    - vinayak-mehta
    - bosd
    - izahn
    - AaronOpfer
